<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center text-white font-sans" x-data="app()">

    <div class="bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 text-center transform transition-all duration-500 hover:scale-[1.01]">
        
        <!-- Icono decorativo -->
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-pink-500 to-violet-500 rounded-full mb-6 shadow-lg animate-bounce">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
            </svg>
        </div>

        <!-- Título dinámico -->
        <h1 class="text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text.text-transparent" x-text="greeting"></h1>
        
        <p class="text-purple-200 text-sm mb-6">¡Bienvenido a tu primera aplicación interactiva construida con Tailwind CSS y Alpine.js!</p>

        <!-- Controles interactivos -->
        <div class="space-y-4">
            <div>
                <label for="name" class="block text-xs uppercase tracking-wider text-purple-300 mb-1 font-semibold">Personaliza tu saludo:</label>
                <input type="text" id="name" x-model="name" @input="updateGreeting()" placeholder="Escribe tu nombre..." class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-pink-500 focus:outline-none focus:ring-2 focus:ring-pink-500/50 text-white placeholder-purple-400/50 transition-all text-center">
            </div>

            <div class="flex gap-2 pt-2">
                <button @click="changeLanguage('es')" :class="{'bg-pink-600': lang === 'es', 'bg-white/10': lang !== 'es'}" class="flex-1 py-2 rounded-xl text-sm font-medium transition-all border border-white/10 hover:bg-pink-600/55">
                    Español
                </button>
                <button @click="changeLanguage('en')" :class="{'bg-pink-600': lang === 'en', 'bg-white/10': lang !== 'en'}" class="flex-1 py-2 rounded-xl text-sm font-medium transition-all border border-white/10 hover:bg-pink-600/55">
                    English
                </button>
                <button @click="changeLanguage('fr')" :class="{'bg-pink-600': lang === 'fr', 'bg-white/10': lang !== 'fr'}" class="flex-1 py-2 rounded-xl text-sm font-medium transition-all border border-white/10 hover:bg-pink-600/55">
                    Français
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 pt-4 border-t border-white/10 text-xs text-purple-300/60">
            Hecho con ❤️ para ti
        </div>
    </div>

    <script>
        function app() {
            return {
                name: '',
                lang: 'es',
                greeting: '¡Hola, Mundo!',
                translations: {
                    es: '¡Hola, Mundo!',
                    en: 'Hello, World!',
                    fr: 'Bonjour le Monde!'
                },
                updateGreeting() {
                    if (this.name.trim() === '') {
                        this.greeting = this.translations[this.lang];
                    } else {
                        const prefixes = {
                            es: '¡Hola, ',
                            en: 'Hello, ',
                            fr: 'Bonjour '
                        };
                        const suffix = this.lang === 'es' || this.lang === 'fr' ? '!' : '!';
                        this.greeting = `${prefixes[this.lang]}${this.name}${suffix}`;
                    }
                },
                changeLanguage(newLang) {
                    this.lang = newLang;
                    this.updateGreeting();
                }
            }
        }
    </script>
</body>
</html>
